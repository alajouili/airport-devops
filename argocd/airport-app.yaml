apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airport
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alajouili/airport-devops.git
    targetRevision: main
    path: charts/airport
    helm: 
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: airport
  syncPolicy:
    automated:
      prune: true
      selfHeal: true