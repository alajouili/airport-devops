name : CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'charts/**'
      - 'argocd/**'
      - 'k8s/**'
      - '**md'
      - 'monitoring/**'
  pull_request:
    branches: [main]
  
jobs:
  backend-tests:
    name: Backend - tests JUnit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Recuperer le code 
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Lancer les tests
        run: mvn -B test

  frontend-tests:
    name: Frontend - tests Vitest et build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Recuperer le code 
        uses: actions/checkout@v5

      - name: Installer Node 24
        uses: actions/setup-node@v5
        with: 
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Lancer les tests
        run: npm test -- --watch=false

      - name: Build de production
        run: npm run build  

      # ---------------- Job 3 : images Docker ----------------
  build-scan-push:
    name: Image ${{ matrix.service }}
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/airport-${{ matrix.service }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Préparer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construire l'image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scanner l'image avec Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Connexion à ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image
        if: github.event_name == 'push'
        run: |
          docker tag $IMAGE:${{ github.sha }} $IMAGE:latest
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
      
  update-manifests:
    name: Mettre à jour la version dans le chart Helm
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Écrire le nouveau tag dans values.yaml
        env:
          TAG: ${{ github.sha }}
        run: |
          yq -i '.backend.image.tag = strenv(TAG) | .frontend.image.tag = strenv(TAG)' charts/airport/values.yaml
          git diff

      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/airport/values.yaml
          git commit -m "Deploy ${GITHUB_SHA::7} [skip ci]"
          git pull --rebase
          git push