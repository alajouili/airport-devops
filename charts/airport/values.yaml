db:
  image: postgres:18
  name: airport_db
  existingSecret: db-credentials
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

backend:
  replicas: 3
  image:
    repository: ghcr.io/alajouili/airport-backend
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

frontend:
  replicas: 2
  image:
    repository: ghcr.io/alajouili/airport-frontend
    tag: latest
    pullPolicy: Always
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

gateway:
  className: eg