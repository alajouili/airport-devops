server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Appels API -> backend (nom du conteneur sur le réseau Docker)
    location /api/ {
        proxy_pass http://airport-backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Angular est une SPA : toute route inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}